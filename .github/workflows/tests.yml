name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Browser model and worker tests
        run: node --test tests/*.cjs
      - name: Complete Python test suite
        run: python -m pytest -q
      - name: Exact pre-prosthesis simulator regression
        run: |
          git show 2dd04f48f491adc545ba8e10663a458e153fbf85:flyhamlet/sim.py > "$RUNNER_TEMP/flyhamlet-sim-baseline.py"
          python scripts/check_prosthesis_regression.py --baseline "$RUNNER_TEMP/flyhamlet-sim-baseline.py"
