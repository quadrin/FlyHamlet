[project]
name = "flyhamlet"
version = "0.1.0"
description = "The FlyWire fruit-fly connectome as a leaky integrate-and-fire typist"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.12", "pandas>=2.2", "pyarrow>=15", "pyyaml>=6", "numba>=0.60", "matplotlib>=3.8"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
